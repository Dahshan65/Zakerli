<style>
:root{
  --navy:#0B1F3A;--p:#1E3A8A;--p2:#2B4FB3;--a:#0F766E;--gold:#C9A227;--y:#B7791F;--r:#B42318;--g:#15803D;
  --bg:#F3F5F9;--card:#FFFFFF;--t:#0F172A;--m:#64748B;--b:#E2E8F0;
  --sh:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.06);
  --ba-navy:linear-gradient(135deg,#1E3A8A,#24479E);--ba-teal:linear-gradient(135deg,#0F766E,#11857C);
  --ba-gold:linear-gradient(135deg,#9A6A12,#B7832A);--ba-slate:linear-gradient(135deg,#1E293B,#334155);
  --ba-red:linear-gradient(135deg,#9F1D2D,#B42318);--ba-green:linear-gradient(135deg,#166534,#15803D)
}
body.dark{--bg:#0A1220;--card:#111B2E;--t:#E5E9F0;--m:#94A3B8;--b:#1F2C44;--p:#2B4FB3;--sh:0 4px 18px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:'Poppins','Noto Naskh Arabic','Segoe UI',Tahoma,Arial,sans-serif;color:var(--t);min-height:100vh;transition:background .3s;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
#app{max-width:560px;margin:0 auto;padding:16px 16px 100px;min-height:100vh}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--sh);border:1px solid var(--b)}
.muted{color:var(--m)}
.small{font-size:13px}
.h1{font-size:23px;font-weight:700;letter-spacing:-.2px}
.h2{font-size:18px;font-weight:700}
.h3{font-size:16px;font-weight:700}
.mt{margin-top:14px}.mt2{margin-top:22px}.mb{margin-bottom:12px}

/* الأزرار */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;font-weight:600;font-size:16px;transition:transform .12s,filter .2s,background .2s;width:100%;letter-spacing:.1px}
.btn:active{transform:scale(.98)}
.btn:hover{filter:brightness(1.07)}
.btn-p{background:var(--p);color:#fff;box-shadow:0 4px 12px rgba(30,58,138,.25)}
.btn-a{background:var(--a);color:#fff;box-shadow:0 4px 12px rgba(15,118,110,.22)}
.btn-y{background:var(--y);color:#fff;box-shadow:0 4px 12px rgba(183,121,31,.22)}
.btn-r{background:var(--r);color:#fff;box-shadow:0 4px 12px rgba(180,35,24,.2)}
.btn-g{background:var(--g);color:#fff;box-shadow:0 4px 12px rgba(21,128,61,.2)}
.btn-o{background:var(--card);border:1.5px solid var(--b);color:var(--t)}
.btn-o:hover{border-color:var(--p)}
.btn-s{padding:8px 13px;font-size:14px;border-radius:10px;width:auto}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--b);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--sh);color:var(--t)}
.lang-btn{padding:6px 12px;border-radius:999px;background:var(--card);border:1.5px solid var(--gold);color:var(--t);font-weight:700;font-size:13px}

/* الرأس */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:21px;color:var(--t)}
.logo i{font-style:normal;width:38px;height:38px;border-radius:11px;background:var(--navy);display:flex;align-items:center;justify-content:center;font-size:20px;border-bottom:3px solid var(--gold)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:var(--card);border:1px solid var(--b);font-weight:600;font-size:13.5px}

/* البطاقة الرئيسية */
.hero{background:linear-gradient(135deg,#0B1F3A 0%,#16305F 60%,#1E3A8A 100%);color:#fff;border-radius:18px;padding:20px;position:relative;overflow:hidden;box-shadow:0 10px 26px rgba(11,31,58,.28)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 0%,rgba(201,162,39,.22),transparent 45%)}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--gold)}
.hero .lvl{background:rgba(201,162,39,.18);border:1px solid rgba(201,162,39,.5);color:#F3D98B;padding:3px 11px;border-radius:999px;font-weight:600;font-size:12.5px;display:inline-block;margin-top:4px}
.bar{height:8px;border-radius:99px;background:#E7EBF2;overflow:hidden}
body.dark .bar{background:rgba(255,255,255,.08)}
.hero .bar{background:rgba(255,255,255,.15)}
.bar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,#C9A227,#E2BE55);transition:width .6s}
.stat{text-align:center;padding:12px 6px}
.stat b{display:block;font-size:21px;font-weight:700;color:var(--t)}
.stat span{font-size:12px;color:var(--m);font-weight:500}

/* بلاطات الأقسام */
.big-action{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;color:#fff;text-align:start;width:100%;box-shadow:0 6px 16px rgba(15,23,42,.12);transition:transform .12s}
.big-action:active{transform:scale(.98)}
.big-action.vert{flex-direction:column;text-align:center}
.big-action .ic{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.big-action b{font-size:16px;display:block;font-weight:700}
.big-action small{opacity:.85;font-size:12.5px}

.set-item{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;transition:border-color .2s}
.set-item:hover{border-color:var(--p)}
.set-ic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0}
.ring{--v:0;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--a) calc(var(--v)*1%),var(--b) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring span{width:37px;height:37px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}

/* شريط التنقل */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom))}
.nav-in{max-width:540px;width:100%;background:var(--card);border:1px solid var(--b);border-radius:18px;box-shadow:0 -2px 24px rgba(15,23,42,.1);display:flex;justify-content:space-around;align-items:center;padding:7px 6px}
.nav button{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:600;color:var(--m);padding:4px 8px;border-radius:12px;min-width:58px}
.nav button .e{font-size:21px;filter:grayscale(1);opacity:.6}
.nav button.on{color:var(--p)}
body.dark .nav button.on{color:#7EA2FF}
.nav button.on .e{filter:none;opacity:1}
.nav .fab{width:54px;height:54px;border-radius:16px;background:var(--navy);color:#fff;font-size:28px;margin-top:-30px;box-shadow:0 8px 18px rgba(11,31,58,.35);border-bottom:3px solid var(--gold);display:flex;align-items:center;justify-content:center;font-weight:300}

/* النماذج */
.tabs{display:flex;gap:5px;background:#E8ECF3;padding:4px;border-radius:12px}
body.dark .tabs{background:var(--b)}
.tabs button{flex:1;padding:9px 4px;border-radius:9px;font-weight:600;font-size:13px;color:var(--m)}
.tabs button.on{background:var(--card);color:var(--p);box-shadow:var(--sh)}
body.dark .tabs button.on{color:#9DB8FF}
textarea,input[type=text]{width:100%;border:1.5px solid var(--b);background:var(--card);border-radius:12px;padding:12px 14px;outline:none;transition:border .2s,box-shadow .2s}
textarea:focus,input[type=text]:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(30,58,138,.12)}
textarea{min-height:180px;resize:vertical;line-height:1.8}
.drop{border:2px dashed #C7D0DE;border-radius:14px;padding:22px;text-align:center;cursor:pointer;background:var(--card);color:var(--t)}
.drop:hover{border-color:var(--p)}
.drop .e{font-size:34px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs div{position:relative;width:74px;height:74px;border-radius:10px;overflow:hidden;border:1.5px solid var(--b)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--r);color:#fff;font-size:12px;line-height:22px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:8px 14px;border-radius:10px;border:1.5px solid var(--b);font-weight:600;font-size:14px;background:var(--card);color:var(--t)}
.pill.on{border-color:var(--p);background:var(--p);color:#fff}
.label{font-weight:600;margin-bottom:8px;font-size:14.5px;color:var(--t)}

/* الأسئلة */
.opt{width:100%;text-align:start;padding:14px 15px;border-radius:12px;border:1.5px solid var(--b);background:var(--card);font-weight:500;font-size:16px;display:flex;align-items:center;gap:12px;transition:all .15s;line-height:1.6;color:var(--t)}
.opt:hover{border-color:#9AACD0}
.opt .k{width:30px;height:30px;border-radius:8px;background:#EEF2F8;color:var(--p);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:14px}
body.dark .opt .k{background:var(--b);color:#9DB8FF}
.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--p);background:rgba(30,58,138,.06)}
.opt.ok{border-color:var(--g);background:rgba(21,128,61,.08)}
.opt.ok .k{background:var(--g);color:#fff}
.opt.no{border-color:var(--r);background:rgba(180,35,24,.07);animation:shake .4s}
.opt.no .k{background:var(--r);color:#fff}
.opt.dim{opacity:.5}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qtext{font-size:19px;font-weight:600;line-height:1.85;margin:12px 0 18px}
.blank{display:inline-block;min-width:70px;border-bottom:2.5px dashed var(--gold);margin:0 4px}
.badge-t{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(30,58,138,.08);color:var(--p)}
body.dark .badge-t{color:#9DB8FF;background:rgba(125,160,255,.12)}
.fb{border-radius:14px;padding:14px 16px;margin-top:14px;animation:up .3s}
.fb.ok{background:rgba(21,128,61,.07);border:1.5px solid rgba(21,128,61,.35)}
.fb.no{background:rgba(180,35,24,.06);border:1.5px solid rgba(180,35,24,.3)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.combo{font-weight:700;color:var(--y);animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.xp-float{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-size:26px;font-weight:700;color:var(--gold);text-shadow:0 2px 8px rgba(0,0,0,.15);pointer-events:none;animation:flo 1s forwards;z-index:60}
@keyframes flo{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-80px}}

/* البطاقات القلّابة */
.flip{perspective:1200px;height:320px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;font-size:21px;font-weight:600;line-height:1.8;box-shadow:var(--sh)}
.face.f{background:linear-gradient(135deg,#0B1F3A,#1E3A8A);color:#fff;border-bottom:4px solid var(--gold)}
.face.b{background:var(--card);border:1.5px solid var(--b);transform:rotateY(180deg);font-size:18.5px;font-weight:500}
.face small{position:absolute;bottom:16px;font-size:12px;opacity:.7;font-weight:500}
.sum li{margin:0 20px 10px 0;line-height:1.9;font-weight:400}
[dir=ltr] .sum li{margin:0 0 10px 20px}

/* المحادثة */
.bubble{max-width:86%;padding:12px 15px;border-radius:16px;line-height:1.85;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.bubble.u{background:var(--p);color:#fff;align-self:flex-start;border-bottom-right-radius:5px}
.bubble.m{background:var(--card);border:1px solid var(--b);align-self:flex-end;border-bottom-left-radius:5px}
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:90px}
.chat-in{position:fixed;bottom:0;left:0;right:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:var(--bg);display:flex;justify-content:center;z-index:25;border-top:1px solid var(--b)}
.chat-in>div{max-width:540px;width:100%;display:flex;gap:8px}
.chat-in input{flex:1}

/* التحميل والتنبيهات */
.overlay{position:fixed;inset:0;background:rgba(11,31,58,.72);backdrop-filter:blur(5px);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.loader-box{background:var(--card);border-radius:20px;padding:28px 22px;text-align:center;max-width:360px;width:100%;border-top:4px solid var(--gold)}
.brain{font-size:56px;animation:bob 1.4s infinite ease-in-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.dots span{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--p);margin:0 3px;animation:dot 1s infinite}
.dots span:nth-child(2){animation-delay:.15s;background:var(--a)}.dots span:nth-child(3){animation-delay:.3s;background:var(--gold)}
@keyframes dot{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:12px;font-weight:600;z-index:70;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .3s;max-width:90%;text-align:center;border-bottom:2px solid var(--gold)}
.badge{text-align:center;padding:14px 6px;border-radius:14px;background:var(--card);border:1px solid var(--b)}
.badge .e{font-size:32px;display:block}
.badge b{font-size:12.5px;display:block;margin-top:4px;font-weight:700}
.badge small{font-size:11px;color:var(--m);display:block;line-height:1.5}
.badge.lock{opacity:.4;filter:grayscale(1)}
.score-ring{--v:0;width:164px;height:164px;border-radius:50%;margin:10px auto;background:conic-gradient(var(--c,var(--g)) calc(var(--v)*1%),var(--b) 0);display:flex;align-items:center;justify-content:center}
.score-ring>div{width:136px;height:136px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring b{font-size:36px;font-weight:700}
.goal{--v:0;width:62px;height:62px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--v)*1%),rgba(255,255,255,.18) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1}
.goal span{width:50px;height:50px;border-radius:50%;background:#0F2748;display:flex;align-items:center;justify-content:center;font-size:21px}
.timer{font-weight:700;font-size:15px;padding:5px 12px;border-radius:10px;background:var(--card);border:1.5px solid var(--b)}
.timer.warn{color:var(--r);border-color:var(--r);animation:pop .5s infinite alternate}
.switch{width:50px;height:28px;border-radius:99px;background:#CBD5E1;position:relative;transition:.2s;flex-shrink:0}
.switch:after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.switch.on{background:var(--p)}
.switch.on:after{right:25px}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--b);font-weight:500}
.list-row:last-child{border:none}
.vs{display:flex;align-items:center;justify-content:space-around;text-align:center}
.vs .p{font-size:15px;font-weight:600}
.vs .p b{display:block;font-size:32px;font-weight:700}
.wrong-item{padding:12px;border-radius:12px;background:var(--bg);margin-top:10px;line-height:1.8;border:1px solid var(--b)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:65}
.empty{text-align:center;padding:30px 10px}
.empty .e{font-size:50px}
.visits{text-align:center;margin:16px auto 4px;font-size:13px;font-weight:700;color:var(--m);min-height:18px}
.onb-or{display:flex;align-items:center;gap:10px;color:var(--m);font-size:13px;font-weight:700;margin:2px 0}.onb-or:before,.onb-or:after{content:'';flex:1;height:1px;background:var(--b)}
.onb-guest{background:none;border:0;color:var(--m);font:inherit;font-size:14px;font-weight:600;text-decoration:underline;padding:6px;cursor:pointer}
.free-badge{width:86px;height:86px;border-radius:50%;background:#bb192c;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-weight:800;font-size:12px;box-shadow:0 6px 18px rgba(187,25,44,.35);animation:fbp 2s infinite;flex:0 0 86px;text-align:center}
.free-badge b{font-size:28px;line-height:1}
@keyframes fbp{0%{box-shadow:0 0 0 0 rgba(187,25,44,.55)}70%{box-shadow:0 0 0 14px rgba(187,25,44,0)}100%{box-shadow:0 0 0 0 rgba(187,25,44,0)}}
.pw-wrap{position:relative}.pw-wrap .pw-in{padding-inline-end:46px}
.pw-eye{position:absolute;top:50%;transform:translateY(-50%);right:8px;background:none;border:0;font-size:18px;cursor:pointer;padding:6px}
.chip,.lang-btn{white-space:nowrap}

body.desk{background:linear-gradient(135deg,#EEF2FA 0%,#F7F8FC 50%,#EEF3F9 100%)}
body.desk.dark{background:#070D18}
body.desk #app{max-width:1180px;margin:0 auto;padding:34px 48px 60px}
body.desk.has-side{padding-inline-start:272px}
body.desk:not(.has-side) #app{max-width:820px}
body.desk.v-create #app,body.desk.v-profileView #app{max-width:900px}
/* الشريط الجانبي */
.side{position:fixed;top:0;bottom:0;inset-inline-start:0;width:272px;z-index:30;display:flex;flex-direction:column;gap:6px;padding:26px 18px 20px;
  background:linear-gradient(170deg,#0B1F3A 0%,#13306B 60%,#1E3A8A 100%);color:#fff;box-shadow:0 0 40px rgba(11,31,58,.25);border-inline-end:3px solid var(--gold)}
.side-logo{display:flex;align-items:center;gap:12px;padding:4px 8px 22px}
.side-logo i{font-style:normal;font-size:30px;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#F1D27A,#C9A227);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.side-logo b{display:block;font-size:24px;letter-spacing:.5px}
.side-logo small{display:block;font-size:12px;color:#C8D3EE;margin-top:2px}
.side-new{width:100%;padding:15px;border-radius:14px;font-size:17px;font-weight:800;color:#0B1F3A;background:linear-gradient(135deg,#F1D27A,#C9A227);box-shadow:0 10px 24px rgba(201,162,39,.35);margin-bottom:14px;transition:transform .15s}
.side-new:hover{transform:translateY(-2px)}
.side nav{display:flex;flex-direction:column;gap:4px}
.side .si{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border-radius:12px;color:#DCE4F5;font-size:16px;font-weight:600;text-align:start;transition:background .15s}
.side .si .e{font-size:21px;width:26px;text-align:center}
.side .si:hover{background:rgba(255,255,255,.08);color:#fff}
.side .si.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 4px 0 0 var(--gold)}
[dir=rtl] .side .si.on{box-shadow:inset -4px 0 0 var(--gold)}
.side-user{margin-top:auto;display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
.side-user .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:19px;background:#F1D27A;color:#0B1F3A;flex:none}
.side-user b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.side-user small{display:block;font-size:12px;color:#C8D3EE;margin-top:2px}
.side-out{width:100%;margin-top:10px;padding:12px;border-radius:12px;font-weight:800;color:#fff;background:#DC2626;transition:background .15s}
.side-out:hover{background:#B91C1C}
/* الرئيسية على الكمبيوتر */
body.desk .top .logo{display:none}
body.desk .hero .out-btn{display:none}
body.desk .hero{padding:30px 34px;border-radius:24px}
body.desk .hero .h1{font-size:34px}
body.desk .home-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
body.desk .home-actions .grid2{display:contents}
body.desk .home-actions .big-action{flex-direction:column;align-items:flex-start;text-align:start;min-height:150px;padding:22px;border-radius:20px;transition:transform .15s,box-shadow .15s}
body.desk .home-actions .big-action:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(11,31,58,.22)}
body.desk .home-actions .big-action .ic{font-size:34px}
body.desk .set-list{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
body.desk .set-list .card{margin:0}
body.desk .set-list .empty{grid-column:1/-1}
body.desk .card{transition:transform .15s,box-shadow .15s}
body.desk .set-item:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(15,23,42,.12);cursor:pointer}
body.desk .grid3{gap:16px}
body.desk .stat b{font-size:30px}
body.desk #libQ{max-width:520px}
body.desk .h1{font-size:30px}
</style>

const DEV_KEY = 'zakerli_dev';

        r.onerror = () => no(r.error);
      } catch (e) { no(e); }

  },
  async run(mode, fn) { const db = await this.open(); return new Promise((ok, no) => { const tx = db.transaction('kv', mode), st = tx.objectStore('kv'), q = fn(st); tx.oncomplete = () => ok(q && q.result); tx.onerror = () => no(tx.error); tx.onabort = () => no(tx.error); }); },

function cloudSoon() { if (!canCloud()) return; clearTimeout(CLOUD_T); CLOUD_T = setTimeout(() => cloudPush().catch(() => {}), 45000); }   // دفعة واحدة كل فترة لتوفير عمليات الكتابة في الخادم
async function cloudPush() {
  clearTimeout(CLOUD_T); CLOUD_T = null;
  if (!canCloud() || CLOUD_BUSY || !S.sync) return;
  CLOUD_BUSY = true;
  try {
    const sig = S.sync.sig || {}, ids = new Set(), puts = [];
    for (const s of S.sets) {
      if (s.demo) continue;
      ids.add(s.id);
      const js = JSON.stringify(s), h = hashStr(js);
      if (sig[s.id] !== h) puts.push({ id: s.id, h, js });
    }
    const del = Object.keys(sig).filter(id => !ids.has(id));
    const pj = JSON.stringify(profOf()), ph = hashStr(pj);
    if (!puts.length && !del.length && ph === S.sync.p) return;
    /* دفعات حتى لا يكبر الطلب */
    let batch = [], size = 0;
    const send = async (last) => {
      const body = { action: 'lput', token: S.auth.token, sets: batch.map(x => ({ id: x.id, h: x.h, data: x.js })) };
      if (last) { body.del = del; body.p = { h: ph, data: pj }; }
      await callApi(body);
      batch.forEach(x => { sig[x.id] = x.h; });
      if (last) { del.forEach(id => delete sig[id]); S.sync.p = ph; }
      S.sync.sig = sig; batch = []; size = 0;
    };
    for (const x of puts) {
      if (size + x.js.length > 4e6 && batch.length) await send(false);
      batch.push(x); size += x.js.length;
    }
    await send(true);
    await flushSave();
  } finally { CLOUD_BUSY = false; }
}
async function cloudPull() {
  if (!canCloud()) return;
  const u = S.auth.u;
  try {
    const idx = await callApi({ action: 'lidx', token: S.auth.token });
    if (!S.auth || S.auth.u !== u) return;
    const items = idx.items || {}, sig = S.sync.sig || (S.sync.sig = {});
    const local = new Map(S.sets.filter(s => !s.demo).map(s => [s.id, s]));
    const need = [];
    for (const [id, it] of Object.entries(items)) {
      const l = local.get(id);
      if (!l) { if (!(id in sig)) need.push(id); continue; }        // درس من جهاز آخر
      const changedHere = hashStr(JSON.stringify(l)) !== sig[id];
      if (it.h !== sig[id] && !changedHere) need.push(id);           // تعدّل في جهاز آخر
    }
    for (const id of Object.keys(sig)) if (!items[id] && local.has(id) && hashStr(JSON.stringify(local.get(id))) === sig[id]) {   // حُذف من جهاز آخر
      S.sets = S.sets.filter(s => s.id !== id); delete sig[id];
    }
    let got = 0;
    for (let i = 0; i < need.length; i += 15) {
      const r = await callApi({ action: 'lget', token: S.auth.token, ids: need.slice(i, i + 15) });
      if (!S.auth || S.auth.u !== u) return;
      for (const [id, js] of Object.entries(r.sets || {})) {
        try {
          const s = JSON.parse(js), k = S.sets.findIndex(x => x.id === id);
          if (k >= 0) S.sets[k] = s; else { S.sets.push(s); got++; }
          sig[id] = hashStr(js);
        } catch (e) {}
      }
    }
    if (idx.p && idx.p.h !== S.sync.p && hashStr(JSON.stringify(profOf())) === S.sync.p) {   // النقاط والأوسمة من جهاز آخر
      try { const r = await callApi({ action: 'lget', token: S.auth.token, ids: ['_p'] }); const p = JSON.parse(r.sets._p); Object.assign(S, p); S.sync.p = idx.p.h; } catch (e) {}
    }
    if (got && S.sets.some(s => !s.demo)) S.sets = S.sets.filter(s => !s.demo);   // لا حاجة للدرس التجريبي إذا وصلت دروسه
    await flushSave();
    if (got) toast(t('cloudGot', got));
    if (['home', 'library'].includes(VIEW)) go(VIEW);
    cloudPush().catch(() => {});
  } catch (e) {}
}

const levelOf = xp => Math.floor((1 + Math.sqrt(1 + 4 * xp / 50)) / 2);

function streakAlive() { if (!S.lastDay) return 0; return daysBetween(S.lastDay, dayKey()) <= 1 ? S.streak : 0; }
function addXP(n) {
  if (n <= 0) return;
  touchDay();
  const before = levelOf(S.xp), d = dayKey();
  if (S.lastDay !== d) { S.streak = (S.lastDay && daysBetween(S.lastDay, d) === 1) ? S.streak + 1 : 1; S.lastDay = d; S.best = Math.max(S.best || 0, S.streak); }

}

let AC;
function sfx(type) {
  if (!S.settings.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const seq = { ok: [[660, .08], [880, .12]], no: [[220, .18], [180, .2]], win: [[523, .1], [659, .1], [784, .1], [1046, .25]], tap: [[500, .04]], flip: [[400, .05], [600, .05]] }[type] || [];
    let tm = AC.currentTime;
    seq.forEach(([f, d]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type === 'no' ? 'sawtooth' : 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.18, tm); g.gain.exponentialRampToValueAtTime(.001, tm + d);
      o.connect(g); g.connect(AC.destination); o.start(tm); o.stop(tm + d + .02); tm += d;
    });
  } catch (e) {}
  if (navigator.vibrate && type === 'no') navigator.vibrate(120);
}
function speak(text) {
  try {
    if (!('speechSynthesis' in window)) return toast(t('noTts'));
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const ar = /[؀-ۿ]/.test(text);
    u.lang = ar ? 'ar-SA' : 'en-US'; u.rate = .95;
    const v = speechSynthesis.getVoices().find(v => v.lang.startsWith(ar ? 'ar' : 'en'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

const apiReady = () => CONFIG.API_URL && !CONFIG.API_URL.includes('YOUR-NAME');
async function callApi(body) {
  if (!apiReady()) throw new Error('NOAPI');
  if (!navigator.onLine) throw new Error('OFFLINE');
  const res = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  let data; try { data = await res.json(); } catch (e) { throw new Error('BAD'); }
  if (!res.ok || data.error) { const er = new Error(data.error || ('HTTP ' + res.status)); er.data = data; throw er; }
  return data;
}
async function ai(contents, wantJson, maxTok) {
  const body = { ticket: CUR_TICKET, contents, generationConfig: { temperature: wantJson ? .5 : .7, maxOutputTokens: maxTok || 16384 } };
  if (wantJson) body.generationConfig.responseMimeType = 'application/json';
  return (await callApi(body)).text || '';
}
function parseJSON(x) {
  x = String(x).trim().replace(/^```(json)?/i, '').replace(/```$/, '').trim();
  try { return JSON.parse(x); } catch (e) {}
  const a = x.indexOf('{'), b = x.lastIndexOf('}');
  if (a >= 0 && b > a) return JSON.parse(x.slice(a, b + 1));
  throw new Error('JSON');
}
function aiError(e) {
  const m = String(e && e.message || e);
  if (m === 'STOP') return '';
  if (m === 'auth') return t('e_auth');
  if (m === 'no_db') return t('e_no_db');
  if (m === 'NOAPI') return t('e_noapi');
  if (m === 'OFFLINE') return t('e_off');
  if (e && e.data && e.data.quota) return t('e_quota');
  if (/quota|exhausted/i.test(m)) return t('e_quota');
  if (/429|503|rate|high demand|overloaded|unavailable|no longer available/i.test(m)) return t('e_busy') + ' (' + m.replace(/\s+/g, ' ').slice(0, 70) + ')';
  if (/too large/i.test(m)) return t('pdfBig');
  if (/JSON/.test(m)) return t('e_json');
  return t('e_gen', m.slice(0, 60));
}

function shrinkImage(file) {
  return new Promise((ok, no) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1600; let w = img.width, h = img.height;
        if (w > max || h > max) { const k = max / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        ok(c.toDataURL('image/jpeg', .82).split(',')[1]);
      };
      img.onerror = no; img.src = r.result;
    };
    r.onerror = no; r.readAsDataURL(file);
  });
}

async function countPdfPages(file) {
  try {
    const CH = 4 * 1024 * 1024, dec = new TextDecoder('latin1');
    let pages = 0, maxCount = 0, tail = '';
    for (let i = 0; i < file.size; i += CH) {
      const txt = tail + dec.decode(await file.slice(i, i + CH).arrayBuffer());
      pages += (txt.slice(tail.length ? 0 : 0).match(/\/Type\s*\/Page(?!s)/g) || []).length;
      for (const m of txt.matchAll(/\/Type\s*\/Pages[\s\S]{0,200}?\/Count\s+(\d+)/g)) maxCount = Math.max(maxCount, +m[1]);
      tail = txt.slice(-64);
    }
    return Math.max(maxCount, pages) || 0;
  } catch (e) { return 0; }
}

  if (CR.src === 'pdf') {

/* تشغيل الطلبات 3 في كل مرة، مع إعادة محاولة واحدة لكل طلب يفشل */
async function pool(jobs, limit) {
  const out = new Array(jobs.length); let next = 0;
  async function worker() {
    while (next < jobs.length) {
      const i = next++;
      try { out[i] = { status: 'fulfilled', value: await jobs[i]() }; }
      catch (e) {
        if (/NOAPI|OFFLINE/.test(e && e.message)) { out[i] = { status: 'rejected', reason: e }; continue; }
        await new Promise(r => setTimeout(r, 3000));
        try { out[i] = { status: 'fulfilled', value: await jobs[i]() }; } catch (e2) { out[i] = { status: 'rejected', reason: e2 }; }
      }
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, jobs.length) }, worker));
  return out;
}
function splitN(n, size) { const m = Math.ceil(n / size), base = Math.floor(n / m), r = n % m; return Array.from({ length: m }, (_, i) => base + (i < r ? 1 : 0)); }

async function generate() {
  crSave();

  if (CR.src === 'image') { if (!CR.images.length) return toast(t('needImg')); CR.images.forEach(d => media.push({ inline_data: { mime_type: 'image/jpeg', data: d } })); }
  else if (CR.src === 'pdf') { if (!CR.pdf) return toast(t('needPdf')); }
  else if (CR.src === 'text') { if (CR.text.trim().length < 80) return toast(t('shortText')); media.push({ text: 'المادة:\n' + CR.text.trim().slice(0, 60000) }); }
  else if (CR.topic.trim().length < 3) return toast(t('needTopic'));
  let tk;
  try { tk = await getTicket('gen', lessonCost()); } catch (e) { return toast(aiError(e)); }
  if (CR.src === 'pdf') {
    loading(true, t('ldUp'));
    try { media.push({ file_data: { mime_type: 'application/pdf', file_uri: await uploadPdf(CR.pdf) } }); }
    catch (e) { loading(false); sfx('no'); refund(tk); return toast(aiError(e)); }
  }
  const src = CR.src, topic = CR.topic.trim(), n = qCount(), batches = splitN(n, 20);
  const call = (text, tok) => ai([{ role: 'user', parts: [...media, { text }] }], true, tok).then(parseJSON);
  loading(true, t('ldBig'));
  try {
    const jobs = [() => call(contentPrompt(cardsFor(n), src, topic), 32000), ...batches.map((b, i) => () => call(questionPrompt(b, i + 1, batches.length, src, topic), 24000))];
    const res = await pool(jobs, 3);
    const okQ = res.slice(1).filter(r => r.status === 'fulfilled');
    let qs = dedupe(okQ.flatMap(r => normQs(r.value)));
    if (qs.length < 3) { const err = res.find(r => r.status === 'rejected'); throw err ? err.reason : new Error('JSON'); }
    const c = res[0].status === 'fulfilled' ? res[0].value : {};
    const base = normalize(c), ex = normExtra(c);
    const set = { id: uid(), title: CR.title.trim() || base.title || t('newSet'), subject: base.subject, created: Date.now(), best: 0,
      summary: base.summary, cards: base.cards, qs, lesson: ex.lesson, glossary: ex.glossary, mm: ex.mm, written: ex.written,
      src: src === 'text' ? CR.text.trim().slice(0, 12000) : src === 'topic' ? 'Topic: ' + topic : '' };
    S.sets.push(set); S.stats.created++;
    Object.assign(CR, { text: '', topic: '', title: '', images: [], pdf: null });
    loading(false); save(); sfx('win'); confetti(); addXP(30);
    toast(t('ready', set.qs.length, set.cards.length));
    go('setView', set.id);
  } catch (e) { loading(false); sfx('no'); refund(tk); toast(aiError(e)); }
}

async function genExtras(id) {

  loading(true, t('ldBig'));

  }).join('');
}

function b64u(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

}

  return JSON.parse(new TextDecoder().decode(u));
}

  const ch = Q && Q.ch; if (!ch) return;
  const set = { id: uid(), title: ch.title, subject: ch.subject || '', created: Date.now(), best: 0, src: '', summary: [], cards: [], qs: ch.qs.map(q => ({ ...q, m: 0, w: 0, r: 0 })) };
  Q.items.forEach(it => { const q = set.qs[it.qi]; if (q && it.chosen !== undefined) { q.r = 1; if (it.ok) q.m = 1; else q.w = 1; } });
  S.sets.push(set); save(); toast(t('savedLib')); Q.id = set.id;
}
async function replyChallenge() {
  const ch = Q.ch;
  const payload = { n: S.user.name, s: Q.score, t: ch.qs.length, title: ch.title, subject: ch.subject, qs: ch.qs };
  const url = baseUrl() + '#c=' + await pack(payload);
  shareText(t('shReply', Q.score > ch.s && ch.s >= 0 ? t('shWin') : '', Q.score, ch.qs.length, ch.title), url);
}

/* ---------------- المعلّم الذكي ---------------- */
let T = null, TUT_PRE = '';
function tutorView(id) {
  const s = getSet(id); if (!s) return go('home');
  if (!T || T.id !== id) T = { id, msgs: [] };
  VIEW = 'tutor'; renderNav();
  $('#app').innerHTML = `
  <div class="top"><button class="icon-btn" onclick="T=null;go('setView','${id}')">${back()}</button><div style="text-align:center"><div class="h3">${t('tutorT')}</div><div class="muted small">${esc(s.title)}</div></div><div style="width:42px"></div></div>
  <div class="chat" id="chat"></div>
  <div class="chat-in"><div><input type="text" id="tIn" dir="auto" placeholder="${t('tutorPh')}" onkeydown="if(event.key==='Enter')tSend()"><button class="btn btn-p" style="width:auto;padding:12px 18px" onclick="tSend()">➤</button></div></div>`;
  renderChat();
  if (TUT_PRE) { $('#tIn').value = TUT_PRE; TUT_PRE = ''; tSend(); }
}
function renderChat() {
  const c = $('#chat'); if (!c) return;
  const intro = `<div class="bubble m">${t('tutorHi', esc(S.user.name))}</div>
    <div class="pills">${t('tutorS').map((x, i) => `<button class="pill" onclick="tQuick(${i})">${x}</button>`).join('')}</div>`;
  c.innerHTML = intro + T.msgs.map(m => `<div class="bubble ${m.role === 'user' ? 'u' : 'm'}" dir="auto">${m.role === 'user' ? esc(m.text) : md(m.text)}${m.role !== 'user' ? `<div style="margin-top:6px"><button class="small muted" onclick="speak(${J(m.text.replace(/\*\*/g, ''))})">${t('listen2')}</button></div>` : ''}</div>`).join('') + (T.wait ? '<div class="bubble m"><div class="dots"><span></span><span></span><span></span></div></div>' : '');
  window.scrollTo(0, document.body.scrollHeight);
}
function tQuick(i) { $('#tIn').value = t('tutorS')[i]; tSend(); }
async function tSend() {
  const inp = $('#tIn'); const text = inp.value.trim(); if (!text || T.wait) return;
  try { await getTicket('chat'); } catch (e) { return toast(aiError(e)); }
  inp.value = ''; T.msgs.push({ role: 'user', text }); T.wait = true; renderChat();
  const s = getSet(T.id);
  const stg = S.user.stage === 'uni' ? 'طالب جامعي' : S.user.stage === 'tawjihi' ? 'طالب توجيهي' : 'طالب مدرسة';
  const ctx = `أنت معلّم خصوصي ودود وصبور لـ${stg} اسمه ${S.user.name}. اشرح ببساطة ووضوح وبأمثلة من الحياة، بجمل قصيرة ونقاط عند الحاجة، واستخدم **للتأكيد**. لا تطل أكثر من اللازم. إن سأل عن شيء خارج الدرس فأجبه باختصار ثم أعده للدرس. أجب دائماً بنفس لغة سؤال الطالب (عربي أو English).
الدرس: ${s.title} (${s.subject})
${s.src ? 'نص المادة:\n' + s.src.slice(0, 10000) : ''}
الملخص:\n${s.summary.join('\n')}
بعض أسئلة الدرس:\n${s.qs.slice(0, 15).map(q => '- ' + q.q + ' ← ' + q.o[q.a]).join('\n')}`;
  const contents = [{ role: 'user', parts: [{ text: ctx }] }, { role: 'model', parts: [{ text: 'OK' }] }]
    .concat(T.msgs.slice(-12).map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.text }] })));
  try { const r = await ai(contents, false); T.msgs.push({ role: 'model', text: r.trim() || '...' }); addXP(3); }
  catch (e) { T.msgs.push({ role: 'model', text: '⚠️ ' + aiError(e) }); }
  T.wait = false; save(); renderChat();
}

/* ---------------- الإنجازات ---------------- */
function badgesView() {
  const lv = levelOf(S.xp);
  $('#app').innerHTML = `<div class="top"><div class="h1">${t('bTitle')}</div><div class="row">${langBtn()}<span class="chip">${S.badges.length}/${BADGES.length}</span></div></div>
  <div class="hero" style="text-align:center"><div style="font-size:50px;position:relative;z-index:1">${titleOf(lv).split(' ').pop()}</div><div class="h1" style="position:relative;z-index:1">${t('level', lv)}</div><div style="position:relative;z-index:1">${titleOf(lv)} · ${S.xp} XP</div></div>
  <div class="grid3 mt">
    <div class="card stat"><b>🔥 ${streakAlive()}</b><span>${t('curStreak')}</span></div>
    <div class="card stat"><b>${S.stats.perfect}</b><span>${t('perfect')}</span></div>
    <div class="card stat"><b>${S.stats.cards}</b><span>${t('cardsN')}</span></div>
    <div class="card stat"><b>${S.stats.created}</b><span>${t('setsL')}</span></div>
    <div class="card stat"><b>${S.stats.exams}</b><span>${t('examsL')}</span></div>
    <div class="card stat"><b>${S.stats.challenges}</b><span>${t('chL')}</span></div>
  </div>
  <div class="h2 mt2 mb">${t('badgesL')}</div>
  <div class="grid3">${BADGES.map(b => `<div class="badge ${S.badges.includes(b.id) ? '' : 'lock'}"><span class="e">${b.e}</span><b>${b.n[LI()]}</b><small>${b.d[LI()]}</small></div>`).join('')}</div>`;
}

/* ---------------- الحساب والإعدادات ---------------- */
function profileView() {
  const sw = (k, l) => `<div class="list-row"><span>${t(l)}</span><button class="switch ${S.settings[k] ? 'on' : ''}" onclick="S.settings['${k}']=!S.settings['${k}'];applyTheme();save();go('profileView')"></button></div>`;
  $('#app').innerHTML = `<div class="top"><div class="h1">${t('prof')}</div>${langBtn()}</div>
  ${accCard()}
  <div class="card col mt">
    <div><div class="label">${t('langL')}</div>${langPills("go('profileView')")}</div>
    <div><div class="label">${t('name')}</div><input type="text" value="${esc(S.user.name)}" maxlength="25" onchange="S.user.name=this.value.trim()||S.user.name;save();toast(t('saved'))"></div>
  </div>
  <div class="card mt">${sw('sound', 'sound')}${sw('dark', 'dark')}
    <div class="list-row" onclick="shareApp()" style="cursor:pointer"><span>${t('shareApp')}</span><span>${back() === '→' ? '←' : '→'}</span></div>
    <div class="list-row" onclick="resetAll()" style="cursor:pointer;color:var(--r)"><span>${t('reset')}</span><span>${back() === '→' ? '←' : '→'}</span></div>
  </div>
  ${S.auth && S.auth.token ? `<button class="btn mt2" onclick="logout()" style="width:100%;background:#DC2626;color:#fff;font-size:18px;font-weight:800;padding:16px;border-radius:14px;box-shadow:0 8px 20px rgba(220,38,38,.3)">${t('logout')}</button>` : ''}
  <div class="credit">
    <div style="font-size:30px">🧠</div>
    <div class="h3" style="color:var(--t)">${appName()}</div>
    <div>${t('version')}</div>
    <div class="mt">${t('dev')} <b>Zakerlee Apps</b></div>
    <a class="wa" href="https://wa.me/${CONFIG.WHATSAPP}" target="_blank">${t('wa')}</a>
    <div class="mt"><a href="${CONFIG.INSTAGRAM}" target="_blank">${t('insta')}</a></div>
  </div>`;
}
function accCard() {
  const m = meNow();
  if (!m) return `<div class="card acc-card"><div class="h3">🔐 ${t('accT')}</div><p class="muted small mt">${t('accSub')}</p><div class="grid2 mt"><button class="btn btn-p" onclick="ACC_TAB='reg';ACC_NEXT=['profileView'];go('account')">${t('tabReg')}</button><button class="btn btn-o" onclick="ACC_TAB='log';ACC_NEXT=['profileView'];go('account')">${t('tabLog')}</button></div></div>`;
  return `<div class="card acc-card"><div class="row between"><div><div class="muted small">${t('loggedAs')}</div><div class="h2" dir="ltr" style="text-align:start">${esc(m.u)}</div></div><span class="chip">${m.active ? planName(m.plan) : '🎁 ' + m.left + '/' + m.free}</span></div>
    <div class="mt small" style="font-weight:600">${m.active ? planStatus(m) + '<br>' + (m.until ? t('activeUntil', fmtDate(m.until)) : t('activeForever')) : m.expired ? t('expiredT') : t('trialLeft', m.left, m.free)}</div>
    <div class="muted small">${t('devicesL', m.devices, m.maxDevices)}</div>
    <div class="mt">${m.active ? `<button class="btn btn-o btn-s" style="width:100%" onclick="go('activate')">${t('myPlan')}</button>` : `<button class="btn btn-g btn-s" style="width:100%" onclick="go('activate')">${t('subscribe')}</button>`}</div></div>`;
}
function shareApp() { shareText(t('shApp', appName()), baseUrl()); }
function resetAll() {
  if (!confirmBox(t('resetQ'))) return;
  const keep = { deviceId: S.deviceId, auth: S.auth, lang: S.lang, lastU: S.lastU, sync: S.sync };
  for (const k of Object.keys(S)) delete S[k];
  Object.assign(S, defState(), keep); save(); onboarding();   // المزامنة تحذف الدروس من الخادم أيضاً
}
function applyTheme() { document.body.classList.toggle('dark', !!S.settings.dark); }

/* ---------------- التشغيل ---------------- */
async function boot() {
  S.lang = 'ar';   // يفتح دائماً بالعربية
  if (S.auth && S.auth.u) S.lastU = S.auth.u;
  const remembered = S.remember !== false && S.auth && S.auth.token && S.auth.u ? S.auth : null;   // تذكّرني: يدخل مباشرة بحسابه
  S.auth = null; S.user = null;
  if (remembered) {
    S.auth = remembered;
    await enterUser(remembered.u);
    if (!S.user) S.user = { name: (remembered.me && remembered.me.name) || remembered.u, stage: '' };
  }
  save();
  applyLang(); applyTheme(); countVisit();
  const m = location.hash.match(/#c=([\w-]+)/);
  if (m) {
    try { PENDING_CH = await unpack(m[1]); } catch (e) { toast(t('chBad')); }
    history.replaceState(null, '', location.pathname + location.search);
  }
  S.sets.forEach(x => { if (x.demo && !x.lesson) { const d = x.id === 'demo-ar' ? demoAr() : demoEn(); Object.assign(x, { lesson: d.lesson, glossary: d.glossary, mm: d.mm, written: d.written }); } });
  if (S.auth) refreshMe(false).then(async () => { if (!S.auth && S.user) { await leaveUser(); onboarding(); } });   // انتهت الجلسة ← شاشة الدخول
  if (!S.user) return onboarding();
  if (PENDING_CH) { const c = PENDING_CH; PENDING_CH = null; return openChallenge(c); }
  go('home');
}
boot();
