# ذاكرلي – بناء تطبيق أندرويد (APK) تلقائياً – Dahshan Soft
name: Build Zakerli APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::أضف السرّين KS_B64 و KS_PASS في Settings > Secrets and variables > Actions"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create Android project
        run: |
          mkdir -p zk && cd zk
          mkdir -p "app"
          cat > 'app/build.gradle' <<'ZK_EOF'
          plugins { id 'com.android.application' }
          def vc = (System.getenv('VCODE') ?: '1').toInteger()
          android {
            namespace 'com.dahshansoft.zakerli'
            compileSdk 36
            defaultConfig {
              applicationId 'com.dahshansoft.zakerli'
              minSdk 24
              targetSdk 36
              versionCode vc
              versionName "1.0.${vc}"
            }
            signingConfigs {
              release {
                storeFile file(System.getenv('KS_PATH') ?: 'release.jks')
                storePassword System.getenv('KS_PASS')
                keyAlias 'zakerli'
                keyPassword System.getenv('KS_PASS')
              }
            }
            buildTypes {
              release { minifyEnabled false; signingConfig signingConfigs.release }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            lint { abortOnError false; checkReleaseBuilds false }
          }
          tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
          dependencies { implementation 'androidx.core:core:1.13.1' }
          ZK_EOF
          mkdir -p "app/src/main"
          cat > 'app/src/main/AndroidManifest.xml' <<'ZK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <queries>
                  <intent><action android:name="android.media.action.IMAGE_CAPTURE" /></intent>
                  <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>
                  <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>
                  <intent><action android:name="android.intent.action.GET_CONTENT" /><data android:mimeType="*/*" /></intent>
              </queries>
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/Zk"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:enableOnBackInvokedCallback="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density|fontScale|locale|layoutDirection">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.files"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/files" />
                  </provider>
              </application>
          </manifest>
          ZK_EOF
          mkdir -p "app/src/main/java/com/dahshansoft/zakerli"
          cat > 'app/src/main/java/com/dahshansoft/zakerli/MainActivity.java' <<'ZK_EOF'
          package com.dahshansoft.zakerli;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.print.PrintManager;
          import android.provider.MediaStore;
          import android.speech.tts.TextToSpeech;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import androidx.core.content.FileProvider;

          import java.io.File;
          import java.util.ArrayList;
          import java.util.Locale;

          /* ذاكرلي – تطبيق أندرويد (Dahshan Soft) */
          public class MainActivity extends Activity {

              static final String HOME = "https://zakerlee.com/";
              static final String[] HOSTS = {"zakerlee.com", "www.zakerlee.com", "zakerli.dahshansoft.com"};
              static final int REQ_FILE = 7;
              static final int NAVY = 0xFF0B1F3A;

              WebView web;
              FrameLayout root;
              ValueCallback<Uri[]> fileCb;
              Uri camUri;
              TextToSpeech tts;
              boolean ttsReady = false;
              long lastBack = 0;

              /* يضيف للصفحة: النطق، المشاركة، الطباعة */
              static final String POLY =
                  "(function(){if(window.__zk)return;window.__zk=1;var A=window.ZakerliAndroid;if(!A)return;" +
                  "function U(t){this.text=t||'';this.lang='';this.rate=1;this.pitch=1;this.volume=1;this.voice=null;}" +
                  "var S={speak:function(u){A.speak(String(u.text||''),String(u.lang||''),Number(u.rate)||1)}," +
                  "cancel:function(){A.stop()},pause:function(){},resume:function(){},getVoices:function(){return []}," +
                  "speaking:false,pending:false,paused:false,onvoiceschanged:null,addEventListener:function(){},removeEventListener:function(){}};" +
                  "try{Object.defineProperty(window,'speechSynthesis',{value:S,configurable:true,writable:true})}catch(e){try{window.speechSynthesis=S}catch(e2){}}" +
                  "try{Object.defineProperty(window,'SpeechSynthesisUtterance',{value:U,configurable:true,writable:true})}catch(e){try{window.SpeechSynthesisUtterance=U}catch(e2){}}" +
                  "try{Object.defineProperty(navigator,'share',{value:function(d){d=d||{};A.share(((d.text||'')+' '+(d.url||'')).trim());return Promise.resolve()},configurable:true,writable:true})}catch(e){}" +
                  "window.print=function(){A.print()};" +
                  "})();";

              /* زر الرجوع: يرجع داخل التطبيق بدل الخروج */
              static final String BACK =
                  "(function(){try{" +
                  "if(document.getElementById('loader'))return 'stay';" +
                  "if(typeof FOC!=='undefined'&&FOC.open){focusClose();return 'ok'}" +
                  "if(typeof VIEW!=='undefined'&&VIEW!=='home'&&VIEW!=='onb'){" +
                  "if(VIEW==='quiz'&&typeof quitQuiz==='function'){quitQuiz();return 'ok'}" +
                  "var b=document.querySelector('#app .top .icon-btn');" +
                  "if(b){b.click()}else{go('home')}return 'ok'}" +
                  "return 'exit'}catch(e){return 'exit'}})()";

              static final String OFFLINE =
                  "<html dir='rtl'><head><meta name='viewport' content='width=device-width,initial-scale=1'></head>" +
                  "<body style='margin:0;font-family:sans-serif;background:#0B1F3A;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center'>" +
                  "<div style='padding:24px'><div style='font-size:64px'>📡</div>" +
                  "<h2 style='margin:12px 0 6px'>لا يوجد اتصال بالإنترنت</h2>" +
                  "<p style='opacity:.8;margin:0 0 4px'>ذاكرلي يحتاج الإنترنت ليشرح لك الدروس</p>" +
                  "<p style='opacity:.6;margin:0 0 22px;direction:ltr'>No internet connection</p>" +
                  "<button onclick='ZakerliAndroid.reload()' style='background:#C9A227;color:#0B1F3A;border:0;border-radius:14px;padding:14px 34px;font-size:17px;font-weight:bold'>إعادة المحاولة ↻</button>" +
                  "</div></body></html>";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window w = getWindow();
                  root = new FrameLayout(this);
                  root.setBackgroundColor(NAVY);
                  web = new WebView(this);
                  web.setBackgroundColor(NAVY);
                  root.addView(web, new FrameLayout.LayoutParams(-1, -1));
                  setContentView(root);

                  /* حواف الشاشة: لا يختفي شيء تحت شريط الحالة أو الكيبورد */
                  if (Build.VERSION.SDK_INT >= 30) {
                      w.setDecorFitsSystemWindows(false);
                      w.setStatusBarColor(Color.TRANSPARENT);
                      w.setNavigationBarColor(Color.TRANSPARENT);
                      if (Build.VERSION.SDK_INT >= 29) w.setNavigationBarContrastEnforced(false);
                      root.setOnApplyWindowInsetsListener((v, ins) -> {
                          android.graphics.Insets i = ins.getInsets(WindowInsets.Type.systemBars()
                                  | WindowInsets.Type.ime() | WindowInsets.Type.displayCutout());
                          v.setPadding(i.left, i.top, i.right, i.bottom);
                          return WindowInsets.CONSUMED;
                      });
                  } else {
                      w.setStatusBarColor(NAVY);
                      w.setNavigationBarColor(NAVY);
                  }

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setTextZoom(100);
                  s.setUserAgentString(s.getUserAgentString() + " ZakerliApp/1");

                  web.addJavascriptInterface(new Bridge(), "ZakerliAndroid");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                          return openOutside(req.getUrl());
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          view.evaluateJavascript(POLY, null);
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest req, WebResourceError err) {
                          if (req.isForMainFrame()) {
                              view.loadDataWithBaseURL(null, OFFLINE, "text/html", "utf-8", null);
                          }
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          return pickFile(cb, p);
                      }
                  });

                  tts = new TextToSpeech(this, st -> ttsReady = (st == TextToSpeech.SUCCESS));

                  setupBack();

                  if (savedInstanceState != null) web.restoreState(savedInstanceState);
                  else web.loadUrl(HOME);
              }

              /* الروابط الخارجية (واتساب، إنستغرام، الدفع...) تفتح خارج التطبيق */
              boolean openOutside(Uri u) {
                  String sc = u.getScheme() == null ? "" : u.getScheme();
                  if (sc.equals("https") || sc.equals("http")) {
                      for (String h : HOSTS) if (h.equalsIgnoreCase(u.getHost())) return false;
                  }
                  if (sc.equals("about") || sc.equals("data") || sc.equals("blob")) return false;
                  try {
                      Intent i;
                      if (sc.equals("intent")) i = Intent.parseUri(u.toString(), Intent.URI_INTENT_SCHEME);
                      else i = new Intent(Intent.ACTION_VIEW, u);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (Exception e) {
                      Toast.makeText(this, "تعذّر فتح الرابط", Toast.LENGTH_SHORT).show();
                  }
                  return true;
              }

              /* اختيار صورة / تصوير بالكاميرا / ملف PDF */
              boolean pickFile(ValueCallback<Uri[]> cb, WebChromeClient.FileChooserParams p) {
                  if (fileCb != null) fileCb.onReceiveValue(null);
                  fileCb = cb;
                  camUri = null;

                  boolean image = false;
                  String[] types = p.getAcceptTypes();
                  if (types != null) for (String t : types) if (t != null && t.startsWith("image")) image = true;

                  Intent cam = null;
                  if (image) {
                      try {
                          File dir = new File(getCacheDir(), "camera");
                          dir.mkdirs();
                          File f = new File(dir, "zakerli_" + System.currentTimeMillis() + ".jpg");
                          camUri = FileProvider.getUriForFile(this, getPackageName() + ".files", f);
                          cam = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                          cam.putExtra(MediaStore.EXTRA_OUTPUT, camUri);
                          cam.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      } catch (Exception e) {
                          cam = null;
                          camUri = null;
                      }
                  }

                  try {
                      if (p.isCaptureEnabled() && cam != null) {
                          startActivityForResult(cam, REQ_FILE);
                      } else {
                          Intent pick = p.createIntent();
                          pick.addCategory(Intent.CATEGORY_OPENABLE);
                          if (p.getMode() == WebChromeClient.FileChooserParams.MODE_OPEN_MULTIPLE)
                              pick.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          Intent chooser = Intent.createChooser(pick, "اختر ملفاً");
                          if (cam != null) chooser.putExtra(Intent.EXTRA_INITIAL_INTENTS, new Intent[]{cam});
                          startActivityForResult(chooser, REQ_FILE);
                      }
                  } catch (Exception e) {
                      fileCb = null;
                      cb.onReceiveValue(null);
                      Toast.makeText(this, "تعذّر فتح الملفات", Toast.LENGTH_SHORT).show();
                      return false;
                  }
                  return true;
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req != REQ_FILE || fileCb == null) return;
                  Uri[] out = null;
                  if (res == RESULT_OK) {
                      ArrayList<Uri> list = new ArrayList<>();
                      if (data != null) {
                          ClipData cd = data.getClipData();
                          if (cd != null) for (int i = 0; i < cd.getItemCount(); i++) list.add(cd.getItemAt(i).getUri());
                          else if (data.getData() != null) list.add(data.getData());
                      }
                      if (list.isEmpty() && camUri != null) list.add(camUri);
                      if (!list.isEmpty()) out = list.toArray(new Uri[0]);
                  }
                  fileCb.onReceiveValue(out);
                  fileCb = null;
              }

              /* زر الرجوع */
              void setupBack() {
                  if (Build.VERSION.SDK_INT >= 33) {
                      getOnBackInvokedDispatcher().registerOnBackInvokedCallback(
                              android.window.OnBackInvokedDispatcher.PRIORITY_DEFAULT, this::handleBack);
                  }
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  handleBack();
              }

              void handleBack() {
                  web.evaluateJavascript(BACK, r -> {
                      if (r != null && r.contains("exit")) {
                          long now = System.currentTimeMillis();
                          if (now - lastBack < 2000) {
                              finish();
                          } else {
                              lastBack = now;
                              Toast.makeText(this, "اضغط رجوع مرة أخرى للخروج", Toast.LENGTH_SHORT).show();
                          }
                      }
                  });
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  web.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }

              @Override
              protected void onDestroy() {
                  if (tts != null) tts.shutdown();
                  web.destroy();
                  super.onDestroy();
              }

              /* الجسر بين الصفحة والهاتف */
              class Bridge {
                  @JavascriptInterface
                  public void speak(String text, String lang, double rate) {
                      if (tts == null || !ttsReady || text == null) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "النطق غير جاهز بعد، حاول بعد ثانية", Toast.LENGTH_SHORT).show());
                          return;
                      }
                      boolean ar = text.matches("(?s).*[\\u0600-\\u06FF].*");
                      Locale loc = ar ? new Locale("ar") : Locale.US;
                      if (lang != null && !lang.isEmpty()) loc = Locale.forLanguageTag(lang);
                      int ok = tts.setLanguage(loc);
                      if (ok == TextToSpeech.LANG_MISSING_DATA || ok == TextToSpeech.LANG_NOT_SUPPORTED) {
                          if (ar) tts.setLanguage(new Locale("ar"));
                          runOnUiThread(() -> Toast.makeText(MainActivity.this,
                                  "ثبّت الصوت العربي من إعدادات الهاتف: تحويل النص إلى كلام", Toast.LENGTH_LONG).show());
                      }
                      tts.setSpeechRate((float) (rate > 0 ? rate : 1));
                      tts.stop();
                      int max = Math.max(500, TextToSpeech.getMaxSpeechInputLength() - 100);
                      String rest = text;
                      int n = 0;
                      while (!rest.isEmpty()) {
                          String part;
                          if (rest.length() <= max) {
                              part = rest;
                              rest = "";
                          } else {
                              int cut = Math.max(rest.lastIndexOf('.', max), Math.max(rest.lastIndexOf('،', max), rest.lastIndexOf('\n', max)));
                              if (cut < max / 2) cut = max;
                              part = rest.substring(0, cut + (cut < rest.length() ? 1 : 0));
                              rest = rest.substring(part.length());
                          }
                          tts.speak(part, TextToSpeech.QUEUE_ADD, null, "z" + (n++));
                      }
                  }

                  @JavascriptInterface
                  public void stop() {
                      if (tts != null) tts.stop();
                  }

                  @JavascriptInterface
                  public void share(String text) {
                      runOnUiThread(() -> {
                          Intent i = new Intent(Intent.ACTION_SEND);
                          i.setType("text/plain");
                          i.putExtra(Intent.EXTRA_TEXT, text);
                          startActivity(Intent.createChooser(i, "مشاركة"));
                      });
                  }

                  @JavascriptInterface
                  public void print() {
                      runOnUiThread(() -> {
                          PrintManager pm = (PrintManager) getSystemService(PRINT_SERVICE);
                          if (pm != null) pm.print("Zakerlee", web.createPrintDocumentAdapter("Zakerlee"), null);
                      });
                  }

                  @JavascriptInterface
                  public void reload() {
                      runOnUiThread(() -> web.loadUrl(HOME));
                  }

                  @JavascriptInterface
                  public boolean isApp() {
                      return true;
                  }
              }
          }
          ZK_EOF
          mkdir -p "app/src/main/res/drawable-nodpi"
          base64 -d > 'app/src/main/res/drawable-nodpi/ic_bg.png' <<'ZK_EOF'
