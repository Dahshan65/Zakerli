
name: Build Zakerli AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare web application
        run: |
          mkdir -p www
          git archive HEAD | tar -x -C www
          rm -rf www/.github www/android www/node_modules
          npm init -y

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8 @capacitor/android@8
          npm install --save-dev @capacitor/cli@8

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.dahshan.zakerli",
            "appName": "Zakerli",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android permissions
        run: |
          chmod +x android/gradlew

      - name: Build Android App Bundle
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZAKERLI_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zakerli-upload.jks"

      - name: Sign AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ZAKERLI_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p release

          jarsigner \
            -keystore "$RUNNER_TEMP/zakerli-upload.jks" \
            -storetype PKCS12 \
            -storepass:env KEYSTORE_PASSWORD \
            -signedjar release/Zakerli.aab \
            android/app/build/outputs/bundle/release/app-release.aab \
            zakerli

          jarsigner -verify release/Zakerli.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Zakerli-AAB
          path: release/Zakerli.aab
          retention-days: 30

      - name: Remove signing key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/zakerli-upload.jks"
