          ZK_EOF
          mkdir -p "app/src/main/res/values"
          cat > 'app/src/main/res/values/strings.xml' <<'ZK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Zakerlee</string></resources>
          ZK_EOF
          mkdir -p "app/src/main/res/values"
          cat > 'app/src/main/res/values/themes.xml' <<'ZK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="navy">#0B1F3A</color>
              <color name="gold">#C9A227</color>
              <style name="Zk" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@color/navy</item>
                  <item name="android:statusBarColor">@color/navy</item>
                  <item name="android:navigationBarColor">@color/navy</item>
                  <item name="android:colorPrimary">@color/navy</item>
                  <item name="android:colorPrimaryDark">@color/navy</item>
                  <item name="android:colorAccent">@color/gold</item>
              </style>
          </resources>
          ZK_EOF
          mkdir -p "app/src/main/res/xml"
          cat > 'app/src/main/res/xml/files.xml' <<'ZK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths><cache-path name="camera" path="camera/" /></paths>
          ZK_EOF
          mkdir -p "."
          cat > 'build.gradle' <<'ZK_EOF'
          plugins { id 'com.android.application' version '8.10.1' apply false }
          ZK_EOF
          mkdir -p "."
          cat > 'gradle.properties' <<'ZK_EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          ZK_EOF
          mkdir -p "."
          cat > 'settings.gradle' <<'ZK_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "Zakerli"
          include ':app'
          ZK_EOF

      - name: Signing key
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/zk/release.jks"

      - name: Build APK + AAB
        working-directory: zk
        env:
          KS_PATH: ${{ github.workspace }}/zk/release.jks
          KS_PASS: ${{ secrets.KS_PASS }}
          VCODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Collect files
        run: |
          mkdir -p out
          cp zk/app/build/outputs/apk/release/app-release.apk out/zakerli.apk
          cp zk/app/build/outputs/bundle/release/app-release.aab out/zakerli.aab
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: zakerli-android
          path: out/

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Zakerlee 1.0.${{ github.run_number }}
          body: "ذاكرلي Zakerlee – تطبيق أندرويد. حمّل الملف zakerli.apk"
          files: out/zakerli.apk
          make_latest: true
